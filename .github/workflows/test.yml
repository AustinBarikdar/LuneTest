name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rojo, Lune and Wally
        uses: CompeyDev/setup-rokit@v0.1.2

      # Wally has no local path dependencies, so link this checkout into the example
      # the same way `wally install` would lay it out.
      - name: Link LuneTest into the example project
        run: |
          mkdir -p example/DevPackages/_Index/austinbarikdar_lunetest@0.1.0
          ln -s "$PWD" example/DevPackages/_Index/austinbarikdar_lunetest@0.1.0/lunetest

      - name: Unit tests
        working-directory: example
        run: lune run test unit
