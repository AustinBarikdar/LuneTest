name: Bug report
description: Something in LuneTest doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste API keys, Wally tokens or Roblox login cookies anywhere in this form.
  - type: input
    id: command
    attributes:
      label: What did you run?
      placeholder: lune run test e2e
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Paste the terminal output. For Studio problems, include what Studio's Output window showed.
      render: text
    validations:
      required: true
  - type: textarea
    id: spec
    attributes:
      label: A small spec that shows the problem
      description: Optional, but it's the fastest way to get a fix.
      render: lua
  - type: input
    id: versions
    attributes:
      label: Versions
      description: LuneTest (from wally.toml), `lune --version`, `rojo --version`
      placeholder: LuneTest 0.1.2, Lune 0.10.5, Rojo 7.7.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Which kind of run?
      multiple: true
      options:
        - unit (inside Lune)
        - e2e (Roblox Studio)
        - cloud (--cloud)
        - setup (init or the installer)
